name: Update Google Adapter

# Triggered by the "Release Google Adapter" workflow in pubnative-hybid-ios-sdk-private
# via repository_dispatch. Bumps GoogleMobileAds-HyBid-Adapters in Podfiles,
# runs pod update, and opens a PR to master.
#
# Secrets required:
#   SLACK_BOT_TOKEN — Slack bot token (xoxb-...)
#   SLACK_IOS_RELEASES_CHANNEL   — #hybid-ios-releases channel ID

on:
  repository_dispatch:
    types: [google-adapter-release]

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    shell: bash -o pipefail {0}

jobs:
  update:
    name: "Bump GoogleMobileAds-HyBid-Adapters and open PR"
    runs-on: macos-latest
    env:
      ADAPTER_VERSION: ${{ github.event.client_payload.adapter_version }}
      HYBID_VERSION:   ${{ github.event.client_payload.hybid_version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump adapter version in Podfiles and run pod update
        run: |
          echo "Updating pod 'GoogleMobileAds-HyBid-Adapters' to $ADAPTER_VERSION in all Podfiles…"
          find . -name Podfile | sort | while read podfile; do
            dir=$(dirname "$podfile")
            echo "  → $podfile"
            sed -i '' "s|pod 'GoogleMobileAds-HyBid-Adapters', '[^']*'|pod 'GoogleMobileAds-HyBid-Adapters', '$ADAPTER_VERSION'|g" "$podfile"
            (cd "$dir" && pod update GoogleMobileAds-HyBid-Adapters)
          done

      - name: Commit, push branch and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="update-google-adapter-${ADAPTER_VERSION}"

          git checkout -B "$BRANCH"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit — already up to date for v$ADAPTER_VERSION"
            exit 0
          fi

          git commit -m "Pod GoogleMobileAds-HyBid-Adapters v: $ADAPTER_VERSION is added"

          git push --force-with-lease origin "$BRANCH" 2>/dev/null \
            || git push --force origin "$BRANCH"

          if gh pr view "$BRANCH" --repo "$GITHUB_REPOSITORY" &>/dev/null; then
            echo "PR already exists for $BRANCH — skipping"
          else
            gh pr create \
              --title "Pod GoogleMobileAds-HyBid-Adapters v: $ADAPTER_VERSION is added" \
              --body  "Automated update: bumps GoogleMobileAds-HyBid-Adapters to v$ADAPTER_VERSION and runs pod update." \
              --base  master \
              --head  "$BRANCH"
          fi

          # Capture PR URL for Slack notification
          PR_URL=$(gh pr view "$BRANCH" --repo "$GITHUB_REPOSITORY" --json url --jq .url 2>/dev/null || echo "")
          echo "PR_URL=$PR_URL"     >> "$GITHUB_ENV"
          echo "PR_OPENED=true"    >> "$GITHUB_ENV"

      # ────────────────────────────────────────────────────────────────────────
      # Slack notifications
      # ────────────────────────────────────────────────────────────────────────

      - name: Slack success notification
        if: success() && env.PR_OPENED == 'true'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_IOS_RELEASES_CHANNEL: ${{ secrets.SLACK_IOS_RELEASES_CHANNEL }}
          STATUS: success
          DEMO_TITLE: "GAD Mediation Demo"
        run: bash .github/scripts/notify-slack.sh

      - name: Slack failure notification
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_IOS_RELEASES_CHANNEL: ${{ secrets.SLACK_IOS_RELEASES_CHANNEL }}
          STATUS: failure
          DEMO_TITLE: "GAD Mediation Demo"
        run: bash .github/scripts/notify-slack.sh
